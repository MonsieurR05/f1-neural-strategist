# Runs both pytest suites (packages/strategist and services/api) on every push. The tests read
# the committed data/processed, data/raw and artifacts/models files, so no pipeline step is needed.
name: tests

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packages/strategist/pyproject.toml
            services/api/pyproject.toml

      # CPU-only torch, as in services/api/Dockerfile: the default Linux wheel pulls in
      # several GB of CUDA libraries the tests never use
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install -e "packages/strategist[ml,dev]"
          pip install -e "services/api[dev]"

      - name: Test strategist package
        working-directory: packages/strategist
        run: python -m pytest

      - name: Test API
        working-directory: services/api
        run: python -m pytest
