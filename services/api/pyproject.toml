[project]
name = "strategist-api"
version = "0.1.0"
description = "HTTP API for the F1 Neural Race Strategist (thin layer over the strategist package)."
requires-python = ">=3.11"
dependencies = [
    "strategist[ml]",          # install packages/strategist first: pip install -e "packages/strategist[ml]"
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
