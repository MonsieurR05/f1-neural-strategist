[package]
name = "strategist-sim"
version = "0.1.0"
edition = "2021"
description = "Rust port of the F1 Neural Race Strategist's lap-time network and Monte Carlo race simulator"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
