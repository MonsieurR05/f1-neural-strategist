# Lap-time model evaluation (python -m strategist.eval.run). Splits come from data_config.
data_config: configs/data.yaml
seed: 42
focus_circuit: Sakhir
bootstrap_reference: lightgbm   # strongest baseline; report differences against it

sigma:
  min_circuit_laps: 200   # per-circuit σ needs this many leave-one-season-out residuals

models:
  circuit_pace: {}
  fuel_deg_linear:
    prior_laps: 300       # pull towards the pooled fit, in laps' worth of evidence
  # Chosen on an inner split inside the training seasons (fit 2021-22, score 2023) by
  # within-race MAE: no weather proxies, start from circuit median ratio, smaller trees.
  lightgbm:
    drop_features: [air_temp, humidity]
    circuit_offset: true
    learning_rate: 0.03
    num_leaves: 15
    min_data_in_leaf: 300
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    max_rounds: 5000
    early_stopping_rounds: 200

  # Structured probabilistic network (strategist.models.lapnet); predicts its own σ.
  # Mean trained with Huber loss, epochs chosen by within-race MAE on the last training
  # season; σ head trained on leave-one-season-out residuals.
  lap_net:
    emb_dim: 8
    hidden: 32
    interaction: true
    lr: 0.003
    weight_decay: 0.0001
    batch_size: 1024
    max_epochs: 40
    patience: 8
    huber_delta: 1.0
    circuit_dropout: 0.1
    sigma_epochs: 15
    ensemble: 5
    threads: 8

artifacts: artifacts/eval
report_dir: docs/reports
report_name: lap_time_models
