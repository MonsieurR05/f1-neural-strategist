# Data scope for ingestion and lap-time model training. See docs/DESIGN.md §3.
# Which adapter fetches each season. Without an F1 TV sign-in, FastF1 only reaches its
# community mirror (2021-2022); OpenF1 covers 2023+. See docs/DESIGN.md §3.
sources:
  fastf1: [2021, 2022]
  openf1: [2023, 2024, 2025]

dry_only: true

split:                  # by season, never by random laps
  train: [2021, 2022, 2023]
  val: [2024]
  test: [2025]

focus_circuit: Sakhir   # Bahrain International Circuit (grand prix layout); MVP sim/UI scope

cleaning:
  neutralised_track_status: ["4", "5", "6", "7"]  # SC, red flag, VSC, VSC ending
  slow_outlier_ratio: 1.07                        # vs the race's median clean lap
  wet_race_inter_share: 0.10    # drop the whole race if >= 10% of laps on inters/wets...
  wet_race_rain_share: 0.25     # ...or rain reported on >= 25% of laps
  damp_window_laps: 2           # else drop slick laps within 2 laps of anyone on inters

# Circuit key = FastF1 location unless aliased here (by event name or location).
circuit_aliases:
  Sakhir Grand Prix: Sakhir Outer   # 2020, outer layout: different track, not Bahrain GP
  Miami Gardens: Miami              # location renamed in 2025
  Monte Carlo: Monaco               # 2021 name for the same circuit

paths:
  fastf1_cache: data/cache
  openf1_cache: data/cache/openf1
  jolpica_cache: data/cache/jolpica
  raw: data/raw
  processed: data/processed

seed: 42
