# Strategy API (services/api). Run from the repository root:
#   uvicorn app.main:app --app-dir services/api --reload
data_config: configs/data.yaml
model_dir: artifacts/models
model_tag: 2021-2025          # lap_net_<tag>.pt and sim_params_<tag>.json (python -m strategist.sim.fit builds them)
threads: 8
cors_origins: ["http://localhost:3000"]

limits:                       # per client IP per hour, and concurrent heavy jobs (0 = no quota)
  simulate_per_hour: 120
  optimise_per_hour: 12
  concurrent_simulate: 2
  concurrent_optimise: 1

simulate:
  default_runs: 300
  max_runs: 1000

optimise:
  max_stops: 2
  pit_step: 2
  min_stint: 6
  screen_runs: 16
  refine_runs: 300
  max_refine_runs: 600
  refine_top: 8
