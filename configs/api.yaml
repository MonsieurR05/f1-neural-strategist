# Strategy API (services/api). Run from the repository root:
#   uvicorn app.main:app --app-dir services/api --reload
data_config: configs/data.yaml
model_dir: artifacts/models
model_tag: 2021-2023          # lap_net_<tag>.pt and sim_params_<tag>.json (python -m strategist.sim.backtest builds them)
threads: 8
cors_origins: ["http://localhost:3000"]

simulate:
  default_runs: 300
  max_runs: 1000

optimise:
  max_stops: 2
  pit_step: 2
  min_stint: 6
  screen_runs: 16
  refine_runs: 300
  max_refine_runs: 600
  refine_top: 8
